<!DOCTYPE html>
<html lang="pt-br">
<head>
    <meta charset="UTF-8">
    <title>Adicionar Produto ao Estoque</title>
    <style>
        body { font-family: sans-serif; margin: 2em; }
        input, button { font-size: 1em; padding: 0.5em; margin-top: 0.2em; }
        label { display: block; margin-top: 1em; }
    </style>
</head>
<body>
    <h1>Adicionar Novo Produto</h1>
    <form action="/salvar_produto" method="POST">
        <label for="nome">Nome do Produto:</label>
        <input type="text" id="nome" name="nome" required>

        <label for="quantidade">Quantidade:</label>
        <input type="number" id="quantidade" name="quantidade" required>

        <label for="preco">Preço (ex: 123.45):</label>
        <input type="text" id="preco" name="preco" required>

        <br><br>
        <button type="submit">Salvar Produto</button>
    </form>
    <br>
    <a href="/estoque">Ver Estoque Atual</a>
</body>
</html>
