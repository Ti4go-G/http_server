<!DOCTYPE html>
<html lang="pt-br">
<head>
  <meta charset="UTF-8">
  <title>Adicionar Produto</title>
  <style>
    body { font-family: sans-serif; margin: 2em; }
    input { display: block; margin-bottom: 10px; padding: 6px; width: 200px; }
    button { padding: 8px 16px; background-color: #007bff; color: white; border: none; border-radius: 4px; }
  </style>
</head>
<body>
  <h1>Adicionar Produto</h1>
  <form method="POST" action="/salvar_produto">
    <label>Nome:</label>
    <input type="text" name="nome" required>
    
    <label>Quantidade:</label>
    <input type="number" name="quantidade" required>

    <label>Preço:</label>
    <input type="text" name="preco" required>

    <button type="submit">Salvar</button>
  </form>
  <a href="/estoque">Voltar</a>
</body>
</html>
